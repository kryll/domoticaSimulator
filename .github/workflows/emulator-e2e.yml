name: Laboratorio e2e (HA real)

# Solo manual: levanta Home Assistant, Mosquitto, Caddy y el orquestador en Docker y prueba el
# viaje completo. Con los perfiles de E2 (por defecto zwave y esphome) prueba también las vías
# reales: Z-Wave JS (mock de zwave-js + Z-Wave JS UI → integración zwave_js) y la API nativa de
# ESPHome (→ integración esphome). Con «shelly» (E3), Shelly Gen2+ emulados → integración shelly.
# Con «matter» (E3): bridge de matter.js comisionado en matterjs-server (→ integración matter), y
# después reinicia el orquestador y repite la prueba para comprobar que no se vuelve a comisionar.
# No se programa para no gastar minutos de Actions.
on:
  workflow_dispatch:
    inputs:
      perfiles:
        description: 'Perfiles del laboratorio separados por comas (zwave, esphome, shelly, matter; vacío = solo MQTT)'
        required: false
        default: 'zwave,esphome'

permissions:
  contents: read

concurrency:
  group: emulator-e2e
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            emulator/package-lock.json
      - name: Dependencias del laboratorio
        working-directory: emulator
        run: npm ci
      - name: Typecheck y tests del orquestador (aedes, mock de Z-Wave con el driver real, API de ESPHome, bridge Matter)
        working-directory: emulator
        run: |
          npm run typecheck
          npm test
      - name: Levantar el laboratorio y hacer el onboarding
        env:
          PERFILES: ${{ inputs.perfiles }}
        run: |
          FLAGS=()
          IFS=',' read -r -a LIST <<< "${PERFILES:-}"
          for p in "${LIST[@]}"; do
            p="$(echo "$p" | tr -d ' ')"
            case "$p" in
              zwave|esphome|shelly|matter) FLAGS+=("--$p") ;;
              '') ;;
              *) echo "Perfil desconocido: $p" >&2; exit 2 ;;
            esac
          done
          # Como en un PC real: primero el laboratorio de E1 y después setup.sh otra vez, con los
          # perfiles, sobre un HA que ya tiene hecho el onboarding.
          emulator/scripts/setup.sh
          emulator/scripts/setup.sh "${FLAGS[@]}"
          grep '^COMPOSE_PROFILES=' emulator/.env || echo 'Sin perfiles: solo MQTT'
      - name: Viaje completo (proyecto demo → HA → comando → estado; vías reales con sus perfiles)
        working-directory: emulator
        # El orquestador exige el token del laboratorio que setup.sh genera en .env.
        run: |
          LAB_TOKEN="$(grep '^LAB_TOKEN=' .env | cut -d= -f2-)"
          echo "::add-mask::$LAB_TOKEN"
          export LAB_TOKEN
          E2E_PROFILES="$(grep '^COMPOSE_PROFILES=' .env | cut -d= -f2- || true)"
          export E2E_PROFILES
          npm run e2e
      - name: Matter tras reiniciar el orquestador (se reutiliza el comisionado, sin duplicados)
        if: contains(inputs.perfiles, 'matter')
        working-directory: emulator
        run: |
          LAB_TOKEN="$(grep '^LAB_TOKEN=' .env | cut -d= -f2-)"
          echo "::add-mask::$LAB_TOKEN"
          export LAB_TOKEN
          E2E_PROFILES="$(grep '^COMPOSE_PROFILES=' .env | cut -d= -f2- || true)"
          export E2E_PROFILES
          SINCE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker restart hasim-orchestrator
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8081/health >/dev/null && break; sleep 2; done
          npm run e2e
          # Solo los logs desde el reinicio: el bridge se reutiliza y no se vuelve a comisionar.
          docker logs --since "$SINCE" hasim-orchestrator 2>&1 | grep 'se reutiliza'
          if docker logs --since "$SINCE" hasim-orchestrator 2>&1 | grep -q 'comisionando el bridge'; then echo 'Se ha vuelto a comisionar el bridge' >&2; exit 1; fi
      - name: Logs si falla
        if: failure()
        working-directory: emulator
        run: docker compose --profile zwave --profile matter logs --no-color --tail=400
      - name: Parar
        if: always()
        working-directory: emulator
        run: docker compose --profile zwave --profile matter down -v
