name: Laboratorio e2e (HA real)

# Solo manual: levanta Home Assistant, Mosquitto, Caddy y el orquestador en Docker y prueba el
# viaje completo. No se programa para no gastar minutos de Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-e2e
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            emulator/package-lock.json
      - name: Dependencias del laboratorio
        working-directory: emulator
        run: npm ci
      - name: Typecheck y tests del orquestador (aedes)
        working-directory: emulator
        run: |
          npm run typecheck
          npm test
      - name: Levantar el laboratorio y hacer el onboarding
        run: emulator/scripts/setup.sh
      - name: Viaje completo (proyecto demo → HA → comando → estado)
        working-directory: emulator
        run: npm run e2e
      - name: Logs si falla
        if: failure()
        working-directory: emulator
        run: docker compose logs --no-color --tail=300
      - name: Parar
        if: always()
        working-directory: emulator
        run: docker compose down -v
