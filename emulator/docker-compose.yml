# Laboratorio de HA Simulator: entorno de pruebas en tu PC, 100 % libre y gratuito.
# Todo va en red «host» (Linux): Matter necesita IPv6 y mDNS y así no hay que publicar puertos.
# Arranque: scripts/setup.sh · Parada: scripts/stop.sh · Borrado: scripts/reset.sh
# restart: "no" — el laboratorio se arranca y se para a voluntad (no vuelve solo al reiniciar el PC).
#
# Seguridad: Caddy (8080) escucha solo en 127.0.0.1 salvo que pongas LAB_BIND=0.0.0.0 en .env;
# Mosquitto y el orquestador, solo en 127.0.0.1. El orquestador exige el token LAB_TOKEN de .env.
# El control de Docker (docker.sock) NO se monta por defecto: va en docker-compose.docker.yml
# (setup.sh --docker), necesario para restaurar snapshots.
#
# Perfiles de E2 (setup.sh --zwave / --esphome / --all; se recuerdan en .env con COMPOSE_PROFILES):
#   zwave:   zwave-mock (controlador Z-Wave emulado con zwave-js) + Z-Wave JS UI → integración zwave_js.
#   esphome: sin contenedores nuevos; el orquestador emula la API nativa de cada nodo ESPHome en
#            127.0.0.1:16053+n → integración esphome.
# Perfiles de E3 (incluidos en --all):
#   shelly:  (setup.sh --shelly) sin contenedores nuevos; el orquestador emula cada Shelly Gen2+
#            (HTTP /shelly + WebSocket /rpc) en 127.0.0.1:18181+n → integración shelly.
#   matter:  (setup.sh --matter) matterjs-server (API WebSocket solo en 127.0.0.1:5580) + bridge Matter
#            de matter.js dentro del orquestador (UDP 5541 y mDNS) → integración matter.
name: hasim-lab

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: hasim-mosquitto
    network_mode: host
    restart: "no"
    # Solo las dos contraseñas MQTT (no todo .env: el token del lab no hace falta aquí).
    environment:
      MQTT_HASIM_PASSWORD: ${MQTT_HASIM_PASSWORD}
      MQTT_HA_PASSWORD: ${MQTT_HA_PASSWORD}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl.src:ro
      - mosquitto-data:/mosquitto/data
    # Crea passwd (con las contraseñas de .env, que nunca se suben) y copia la ACL a una carpeta
    # propia dentro del contenedor, con propietario mosquitto y modo 0600: así Mosquitto 2 no
    # avisa de permisos (el archivo montado del host tiene el uid del usuario del PC y modo 0644).
    entrypoint:
      - sh
      - -c
      - |
        set -e
        umask 077
        mkdir -p /mosquitto/auth
        rm -f /mosquitto/auth/passwd /mosquitto/auth/acl
        touch /mosquitto/auth/passwd
        mosquitto_passwd -b /mosquitto/auth/passwd hasim "$$MQTT_HASIM_PASSWORD"
        mosquitto_passwd -b /mosquitto/auth/passwd homeassistant "$$MQTT_HA_PASSWORD"
        cp /mosquitto/config/acl.src /mosquitto/auth/acl
        chown -R mosquitto:mosquitto /mosquitto/auth
        chmod 0700 /mosquitto/auth
        chmod 0600 /mosquitto/auth/passwd /mosquitto/auth/acl
        exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -u homeassistant -P \"$$MQTT_HA_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 5s
      timeout: 5s
      retries: 20

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: hasim-homeassistant
    network_mode: host
    restart: "no"
    environment:
      TZ: ${TZ:-Europe/Madrid}
    volumes:
      - ./ha-config:/config
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      mosquitto:
        condition: service_healthy

  orchestrator:
    build:
      context: ..
      dockerfile: emulator/orchestrator/Dockerfile
    image: hasim-orchestrator:local
    container_name: hasim-orchestrator
    network_mode: host
    restart: "no"
    env_file: .env
    environment:
      MQTT_URL: mqtt://127.0.0.1:1883
      MQTT_USERNAME: hasim
      MQTT_PASSWORD: ${MQTT_HASIM_PASSWORD}
      HOST: 127.0.0.1
      PORT: "8081"
      HA_URL: http://127.0.0.1:8123
      HA_CONFIG_DIR: /ha-config
      SNAPSHOTS_DIR: /snapshots
      SECRETS_DIR: /secrets
      HA_CONTAINER: hasim-homeassistant
      # Perfiles activos (vías reales de E2) y sus servicios, todos en 127.0.0.1.
      HASIM_PROFILES: ${COMPOSE_PROFILES:-}
      ZWAVE_MOCK_URL: ws://127.0.0.1:5556
      ZWAVE_JS_URL: ws://127.0.0.1:3000
      ZWAVE_DATA_DIR: /zwave
      ESPHOME_HOST: 127.0.0.1
      ESPHOME_PORT_BASE: "16053"
      MATTER_SERVER_URL: ws://127.0.0.1:5580/ws
      MATTER_BRIDGE_PORT: "5541"
      MATTER_DATA_DIR: /matter/bridge
      # LAB_TOKEN llega de .env (env_file): el orquestador lo exige a la app y en /project.
      # Si sirves la app en la LAN con un nombre (p. ej. http://mipc.local:8080), añádelo aquí.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    volumes:
      - ./ha-config:/ha-config
      - ./snapshots:/snapshots
      - ./.secrets:/secrets
      - ./zwave:/zwave
      - ./matter:/matter
    # docker.sock no se monta por defecto (da control total sobre Docker): está en
    # docker-compose.docker.yml, que activa setup.sh --docker (necesario para restaurar snapshots).
    depends_on:
      mosquitto:
        condition: service_healthy

  caddy:
    image: caddy:2
    container_name: hasim-caddy
    network_mode: host
    restart: "no"
    environment:
      # 127.0.0.1 por defecto: la app y el orquestador solo desde este PC. LAB_BIND=0.0.0.0 en
      # .env para abrirlo a la LAN (el orquestador sigue exigiendo el token).
      LAB_BIND: ${LAB_BIND:-127.0.0.1}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../dist:/srv:ro
      - caddy-data:/data

  # ---- Perfil «zwave» (E2) ----
  # Controlador Z-Wave emulado (mock de zwave-js, libre): el puerto serie por TCP (5555) solo existe
  # en la red interna de Docker; el WebSocket de control (5556) se publica solo en 127.0.0.1 y exige
  # LAB_TOKEN. Usa la misma imagen que el orquestador.
  zwave-mock:
    profiles: ["zwave"]
    build:
      context: ..
      dockerfile: emulator/orchestrator/Dockerfile
    image: hasim-orchestrator:local
    container_name: hasim-zwave-mock
    restart: "no"
    command: ["node", "--import", "tsx", "orchestrator/src/zwave/mockMain.ts"]
    environment:
      LAB_TOKEN: ${LAB_TOKEN}
      ZWAVE_MOCK_PORT: "5555"
      ZWAVE_MOCK_CONTROL_PORT: "5556"
      ZWAVE_MOCK_DATA: /data
    ports:
      - "127.0.0.1:5556:5556"
    volumes:
      - ./zwave/mock:/data

  # Z-Wave JS UI (libre) usa el mock como antena (tcp://zwave-mock:5555; setup.sh deja sus ajustes
  # en zwave/ui/settings.json la primera vez). Sus puertos (8091 interfaz web sin contraseña, 3000
  # servidor de Z-Wave JS para HA) se publican solo en 127.0.0.1.
  zwave-js-ui:
    profiles: ["zwave"]
    image: zwavejs/zwave-js-ui:latest
    container_name: hasim-zwave-js-ui
    restart: "no"
    ports:
      - "127.0.0.1:8091:8091"
      - "127.0.0.1:3000:3000"
    environment:
      TZ: ${TZ:-Europe/Madrid}
    volumes:
      - ./zwave/ui:/usr/src/app/store
    depends_on:
      - zwave-mock

  # ---- Perfil «matter» (E3) ----
  # matterjs-server (libre, el servidor Matter que usa HA) necesita red host (mDNS e IPv6). Su API
  # WebSocket no tiene autenticación: escucha solo en 127.0.0.1 (LISTEN_ADDRESS), igual que HA y el
  # orquestador, que van en red host (su panel web, en http://localhost:5580). Versión fijada. ENABLE_TEST_NET_DCL acepta certificados de
  # pruebas: el bridge de matter.js usa los de desarrollo (vendor 0xFFF1), como todo emulador.
  matter-server:
    profiles: ["matter"]
    image: ghcr.io/matter-js/matterjs-server:1.4.0
    container_name: hasim-matter-server
    network_mode: host
    restart: "no"
    environment:
      LISTEN_ADDRESS: 127.0.0.1
      PORT: "5580"
      ENABLE_TEST_NET_DCL: "true"
      TZ: ${TZ:-Europe/Madrid}
    volumes:
      - matter-data:/data

volumes:
  mosquitto-data:
  caddy-data:
  matter-data:
