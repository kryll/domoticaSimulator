# Mosquitto del laboratorio: solo escucha en el propio PC y exige usuario y contraseña.
persistence false
log_dest stdout
allow_anonymous false
# passwd y acl los prepara el entrypoint de docker-compose.yml (propietario mosquitto, 0600).
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl

listener 1883 127.0.0.1
protocol mqtt

# WebSockets (Caddy los publica en /mqtt para clientes del navegador).
listener 9001 127.0.0.1
protocol websockets
