# Mosquitto del laboratorio: solo escucha en el propio PC y exige usuario y contraseña.
persistence false
log_dest stdout
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

listener 1883 127.0.0.1
protocol mqtt

# WebSockets (Caddy los publica en /mqtt para clientes del navegador).
listener 9001 127.0.0.1
protocol websockets
