- id: '1700000000001'
  alias: Ventana abierta apaga el altavoz
  description: Si se abre la ventana del salón, se pausa la música
  triggers:
    - trigger: state
      entity_id: binary_sensor.ventana_salon_opening
      to: 'on'
  conditions: []
  actions:
    - action: media_player.media_pause
      target:
        entity_id: media_player.altavoz_salon
  mode: single
- id: '1700000000002'
  alias: Luces al atardecer
  triggers:
    - trigger: sun
      event: sunset
      offset: '-00:15:00'
  conditions:
    - condition: time
      weekday: [mon, tue, wed, thu, fri]
  actions:
    - action: light.turn_on
      target:
        entity_id: light.salon_techo
      data:
        brightness_pct: 60
    - action: switch.turn_on
      target:
        entity_id: switch.luz_cocina
    - action: scene.turn_on
      target:
        entity_id: scene.cine
  mode: single
- id: '1700000000003'
  alias: Purificador con polvo
  triggers:
    - trigger: numeric_state
      entity_id: sensor.purificador_pm2_5
      above: 35
      for: '00:05:00'
  actions:
    - action: fan.turn_on
      target:
        entity_id: fan.purificador
    - action: notify.mobile_app_pixel_8
      data:
        message: Calidad del aire mala en el dormitorio
  mode: restart
- id: '1700000000004'
  alias: Con un dispositivo que ya no existe
  triggers:
    - trigger: state
      entity_id: binary_sensor.puerta_garaje
      to: 'on'
  actions:
    - action: light.turn_on
      target:
        entity_id: light.garaje
- alias: Disparador desconocido
  triggers:
    - trigger: geo_location
      source: nws_alerts
      zone: zone.home
      event: enter
  actions:
    - action: light.turn_on
      target:
        entity_id: light.salon_techo
